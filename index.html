<style>
:root{
  --paper:#FFF1E8; --paper-2:#FCE0D0; --paper-3:#F4C8B4;
  --ink:#3A2216; --ink-2:#6B4A38; --ink-3:#8A6A55;
  --accent:#8F0205; --accent-2:#6C0104; --accent-soft:#F9D6C8; --brand:#8F0205;
  --butter:#F2C14E; --line:#F0CDBD;
  --radius:18px;
  --shadow:0 8px 20px -10px rgba(40,20,14,.22), 0 2px 4px -2px rgba(40,20,14,.1);
  --display:"Corben", Georgia, serif;
  --body:"Figtree", system-ui, sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);caret-color:var(--accent);
  }
::selection{background:var(--accent-soft);color:var(--accent-2)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:10px}
html{scrollbar-color:var(--paper-3) transparent;scrollbar-width:thin}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
.wrap{max-width:620px;margin:0 auto;padding:0 20px}
.tnum{font-variant-numeric:tabular-nums lining-nums}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* aviso */
.notice{background:var(--accent-2);color:#fff;font-weight:600;font-size:14px;text-align:center;padding:10px 20px}
.notice[hidden]{display:none}

/* topo */
header.top{text-align:center;padding:0 0 22px;max-width:none}
.band{background:var(--brand);padding:28px 20px 0;margin-bottom:0;position:relative}
.band::after{content:"";display:block;height:56px;background:var(--paper);border-radius:50% 50% 0 0/100% 100% 0 0;margin:0 -20px}
.logo{width:min(220px,56vw);aspect-ratio:1;margin:0 auto -86px;position:relative;z-index:1;filter:drop-shadow(0 10px 18px rgba(60,0,0,.28))}
.logo img{width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.top .inner{max-width:620px;margin:0 auto;padding:82px 20px 0}
.mark{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:#fff;
  display:grid;place-items:center;overflow:hidden;box-shadow:var(--shadow)}
.mark img{width:100%;height:100%;object-fit:cover}
.mark span{font:700 42px/1 var(--display);color:var(--accent);transform:translateY(2px)}
h1{font:700 clamp(32px,8.6vw,46px)/1.08 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.slogan{font:italic 400 17px/1.4 var(--body);color:var(--ink-2);margin:0}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin:20px 0 0;padding:0;list-style:none;color:var(--ink-2);font-size:14px}
.meta li{display:flex;align-items:center;gap:6px}
.meta .icon{width:17px;height:17px;color:var(--accent)}
.meta a{text-decoration:none;font-weight:600}
.meta a:hover{text-decoration:underline}

/* destaques */
.featured{margin-top:6px;margin-bottom:4px}
.featured h2{font:650 15px/1 var(--body);letter-spacing:.01em;color:var(--ink-2);margin:0 0 12px}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 20px 16px;margin:0 -20px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.feat{flex:0 0 74%;max-width:300px;scroll-snap-align:start;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:0;padding:0;text-align:left;position:relative}
.feat .ph{aspect-ratio:4/3;border-radius:0}
.feat .body{padding:12px 14px 14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-end}
.feat b{font:700 16px/1.25 var(--display);display:block}
.feat .price{font-weight:700;color:var(--accent);white-space:nowrap}
.tag{position:absolute;top:10px;left:10px;background:var(--butter);color:var(--ink);font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}

/* navegação de categorias */
nav.cats{position:sticky;top:0;z-index:20;background:rgba(255,241,232,.93);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line)}
nav.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:12px;padding-bottom:12px;scrollbar-width:none}
nav.cats .wrap::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:8px 15px;font-weight:600;font-size:14px;color:var(--ink-2);
  transition:background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* lista */
main{padding-bottom:140px}
section.cat{padding-top:34px}
section.cat h2{font:700 25px/1.15 var(--display);letter-spacing:-.005em;margin:0 0 6px;display:flex;align-items:baseline;gap:10px}
section.cat h2 small{font:500 13px/1 var(--body);color:var(--ink-3);letter-spacing:0}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:1fr 96px;gap:16px;padding:18px 0;border-bottom:1px dashed var(--line);align-items:start}
.item:last-child{border-bottom:0}
.item h3{font:600 17px/1.25 var(--body);margin:0}
.item p{margin:5px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;min-height:38px}
.price{font-weight:700;font-size:17px;color:var(--ink)}
.item .media{position:relative}
.ph{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--paper-2);position:relative;isolation:isolate}
.ph img{width:100%;height:100%;object-fit:cover;transition:opacity .4s var(--ease)}
.ph img[data-loading]{opacity:0}
.ph .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--accent);
  background:var(--paper-2)}
.ph .empty svg{width:42%;height:42%;stroke-width:1.4}
.soldout .ph{filter:grayscale(.8);opacity:.6}
.soldout h3,.soldout .price{color:var(--ink-3)}
.badge-out{font-size:12.5px;font-weight:700;color:var(--accent-2);background:var(--accent-soft);padding:5px 10px;border-radius:99px}

/* botões de quantidade */
.add{border:0;background:var(--accent);color:#fff;border-radius:99px;height:38px;padding:0 16px 0 12px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;
  box-shadow:0 4px 10px -5px rgba(40,20,14,.35);transition:transform .2s var(--ease),background .2s}
.add:hover{background:var(--accent-2)}
.add:active{transform:scale(.96)}
.add .icon{width:18px;height:18px;stroke-width:2.4}
.stepper{display:inline-flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:99px;height:38px}
.stepper button{border:0;background:none;width:38px;height:100%;display:grid;place-items:center;color:var(--accent);border-radius:99px}
.stepper button:hover{background:var(--accent-soft)}
.stepper .icon{width:17px;height:17px;stroke-width:2.4}
.stepper output{min-width:22px;text-align:center;font-weight:700}

/* barra do pedido */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  pointer-events:none;transform:translateY(120%);transition:transform .5s var(--ease)}
.cartbar.show{transform:none}
.cartbar button{pointer-events:auto;width:100%;max-width:588px;margin:0 auto;display:flex;align-items:center;gap:12px;border:0;border-radius:99px;
  background:var(--ink);color:#fff;padding:14px 20px;font-weight:700;font-size:16px;box-shadow:0 10px 24px -10px rgba(0,0,0,.35)}
.cartbar .count{background:var(--accent);color:#fff;border-radius:99px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;padding:0 8px}
.cartbar .count.bump{animation:bump .55s var(--ease)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.35)}100%{transform:scale(1)}}
.cartbar .total{margin-left:auto}

/* folha do pedido */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;visibility:hidden}
.sheet.open{visibility:visible}
.sheet .scrim{position:absolute;inset:0;background:rgba(40,22,14,.45);opacity:0;transition:opacity .35s var(--ease)}
.sheet.open .scrim{opacity:1}
.panel{position:relative;width:100%;max-width:620px;max-height:92vh;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .5s var(--ease)}
.sheet.open .panel{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--paper-3);margin:4px auto 14px}
.panel h2{font:700 24px/1.15 var(--display);margin:0 0 4px;display:flex;justify-content:space-between;align-items:center}
.close{border:0;background:var(--paper-2);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.close:hover{background:var(--paper-3)}
.lines{list-style:none;padding:0;margin:8px 0 0}
.lines li{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 0;border-bottom:1px dashed var(--line);align-items:center}
.lines .name{font-weight:600}
.lines .sub{color:var(--ink-2);font-size:14px}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px;font-weight:700;font-size:18px}
.sum span:first-child{font:700 19px/1 var(--display)}
fieldset{border:0;padding:0;margin:18px 0 0}
legend,label.lbl{font-weight:600;font-size:14px;margin-bottom:8px;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--paper-2);border-radius:14px;padding:4px;gap:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:10px;border-radius:11px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:background .25s var(--ease),color .25s}
.seg input:checked+label{background:#fff;color:var(--ink);box-shadow:0 2px 8px -3px rgba(58,34,22,.3)}
.seg input:focus-visible+label{outline:2.5px solid var(--accent);outline-offset:2px}
.field{margin-top:14px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:#8f7462}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.send{margin-top:20px;width:100%;border:0;border-radius:99px;background:#1F7A4D;color:#fff;font-weight:700;font-size:17px;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 6px 16px -8px rgba(0,0,0,.35)}
.send:hover{background:#196640}
.send[disabled]{background:var(--paper-3);color:var(--ink-3);box-shadow:none;cursor:not-allowed}
.hint{font-size:13.5px;color:var(--ink-2);margin:10px 0 0;text-align:center}
.err{color:var(--accent-2);font-size:13.5px;margin:6px 2px 0}

/* estados */
.state{text-align:center;padding:60px 10px;color:var(--ink-2)}
.state h2{font:700 22px/1.25 var(--display);color:var(--ink);margin:0 0 8px}
.state button{margin-top:16px;border:1.5px solid var(--ink);background:none;border-radius:99px;padding:10px 20px;font-weight:700}
.skel{height:116px;border-radius:14px;margin:16px 0;background:linear-gradient(90deg,var(--paper-2),var(--paper-3),var(--paper-2));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

footer{text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0 0}

@media (min-width:760px){
  .item{grid-template-columns:1fr 120px}
  .feat{flex-basis:44%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

Fatias,Pudim de leite (fatia),"Pudim de leite condensado lisinho, com calda de caramelo.",R$ 10,00,,sim,
Docinhos,Brigadeiro tradicional (cento),Chocolate de verdade e granulado. Encomenda com 2 dias de antecedência.,R$ 120,00,,sim,`;

  /* ---------- utilidades ---------- */
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const brl = n => n.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
  const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const yes = v => /^(s|sim|x|1|true|verdadeiro)$/i.test(String(v||"").trim());
  const no = v => /^(n|nao|não|0|false|falso|esgotado)$/i.test(String(v||"").trim());
  const icon = id => `<svg class="icon" aria-hidden="true"><use href="#i-${id}"/></svg>`;

  function parseCSV(text){
    const rows=[]; let row=[], f="", q=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
      else if(c==='"') q=true;
      else if(c===','){ row.push(f); f=""; }
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
      else f+=c;
    }
    if(f!==""||row.length){ row.push(f); rows.push(row); }
    return rows.filter(r => r.some(x => x.trim()!==""));
  }
  function parsePrice(v){
    let s=String(v||"").replace(/[^\d,.-]/g,"");
    if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
    const n=parseFloat(s); return isFinite(n)?n:null;
  }
  // links do Google Drive viram endereço de imagem; outros links são usados como estão
  function imgURL(v){
    v=String(v||"").trim(); if(!v) return "";
    const m=v.match(/\/d\/([\w-]{20,})/)||v.match(/[?&]id=([\w-]{20,})/);
    if(/drive\.google\.com|docs\.google\.com/.test(v)&&m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w900`;
    return /^https?:\/\//.test(v)?v:"";
  }
  // Lê uma aba da planilha pelo Google Visualization (JSONP): funciona aberto do computador, no Netlify e no celular
  let jsonpN=0;
  function getTable(aba){
    return new Promise((resolve,reject)=>{
      const cb="__gviz"+(++jsonpN)+"_"+Date.now();
      const sc=document.createElement("script");
      const timer=setTimeout(()=>{ cleanup(); reject(new Error("tempo esgotado")); },15000);
      function cleanup(){ clearTimeout(timer); delete window[cb]; sc.remove(); }
      window[cb]=res=>{
        cleanup();
        if(!res||res.status==="error"){ reject(new Error((res&&res.errors&&res.errors[0]&&res.errors[0].detailed_message)||"erro na planilha")); return; }
        const t=res.table||{cols:[],rows:[]};
        const head=t.cols.map(c=>(c.label||c.id||"").trim());
        const rows=(t.rows||[]).map(r=>(r.c||[]).map(c=>c==null?"":String(c.f!=null?c.f:(c.v!=null?c.v:""))));
        resolve([head,...rows]);
      };
      sc.onerror=()=>{ cleanup(); reject(new Error("sem acesso à planilha (ela está pública?)")); };
      sc.src=`https://docs.google.com/spreadsheets/d/${CFG.sheetId}/gviz/tq?tqx=responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(aba)}&_=${Date.now()}`;
      document.head.appendChild(sc);
    });
  }
  const csvToTable=t=>parseCSV(t);

  /* ---------- estado ---------- */
  let LOJA={}, PRODUTOS=[];
  let cart={};
  try{ cart=JSON.parse(localStorage.getItem("cardapio-pedido")||"{}")||{}; }catch(e){ cart={}; }
  const saveCart=()=>{ try{ localStorage.setItem("cardapio-pedido",JSON.stringify(cart)); }catch(e){} };

  async function load(){
    try{
      let lojaT, rows;
      if(DEMO){ rows=csvToTable(DEMO_CSV); LOJA={...DEMO_LOJA}; }
      else {
        [lojaT, rows]=await Promise.all([getTable(CFG.abaLoja).catch(()=>[[]]), getTable(CFG.abaProdutos)]);
        LOJA={};
        lojaT.slice(1).forEach(r=>{ const k=(r[0]||"").trim().toLowerCase(); if(k) LOJA[k]=(r[1]||"").trim(); });
      }
      const head=rows.shift().map(h=>slug(h));
      const col=n=>head.indexOf(n);
      PRODUTOS=rows.map((r,i)=>({
        id: slug((r[col("produto")]||"")+"-"+i),
        categoria:(r[col("categoria")]||"Outros").trim(),
        nome:(r[col("produto")]||"").trim(),
        desc:(r[col("descricao")]||"").trim(),
        preco:parsePrice(r[col("preco")]),
        foto:imgURL(r[col("foto")]),
        disponivel:!no(r[col("disponivel")]),
        destaque:yes(r[col("destaque")])
      })).filter(p=>p.nome);
      // limpa do carrinho itens que saíram do cardápio
      Object.keys(cart).forEach(k=>{ const p=PRODUTOS.find(x=>x.id===k); if(!p||!p.disponivel||p.preco==null) delete cart[k]; });
      render();
    }catch(e){
      console.error(e);
      $("#menu").innerHTML=`<div class="state"><h2>Não conseguimos abrir o cardápio</h2><p>Confira sua internet e tente de novo. Se continuar, chame a loja pelo Instagram.</p><button type="button" id="retry">Tentar de novo</button><p style="font-size:12px;opacity:.7;margin-top:18px">Detalhe: ${esc(e.message)}</p></div>`;
      $("#retry").onclick=()=>{ $("#menu").innerHTML='<div class="skel"></div><div class="skel"></div>'; load(); };
    }
  }

  const canOrder=()=>!!String(LOJA.whatsapp||"").replace(/\D/g,"");

  function photo(p){
    return `<div class="ph">${p.foto?`<img src="${esc(p.foto)}" alt="${esc(p.nome)}" loading="lazy" data-loading onload="this.removeAttribute('data-loading')" onerror="this.remove()">`:""}<div class="empty" ${p.foto?'style="z-index:-1"':""}>${icon("cake")}</div></div>`;
  }
  function control(p){
    if(!p.disponivel) return `<span class="badge-out">Esgotado hoje</span>`;
    if(!canOrder()||p.preco==null) return "";
    const q=cart[p.id]||0;
    if(!q) return `<button type="button" class="add" data-add="${p.id}" aria-label="Adicionar ${esc(p.nome)}">${icon("plus")}Adicionar</button>`;
    return `<span class="stepper" role="group" aria-label="Quantidade de ${esc(p.nome)}"><button type="button" data-dec="${p.id}" aria-label="Diminuir">${icon("minus")}</button><output class="tnum">${q}</output><button type="button" data-add="${p.id}" aria-label="Aumentar">${icon("plus")}</button></span>`;
  }

  function render(){
    // loja
    const nome=LOJA.nome||"Cardápio";
    document.title=`Cardápio · ${nome}`;
    $("#storeName").textContent=nome;
    const logo=imgURL(LOJA.logo);
    if(logo){ const li=$("#logoImg"); li.src=logo; li.alt=nome; }
    $("#slogan").textContent=LOJA.slogan||""; $("#slogan").hidden=!LOJA.slogan;
    const n=$("#notice"); n.textContent=LOJA.aviso||""; n.hidden=!LOJA.aviso;
    const ig=String(LOJA.instagram||"").replace(/^@/,"").trim();
    $("#meta").innerHTML=[
      LOJA.horario&&`<li>${icon("clock")}${esc(LOJA.horario)}</li>`,
      LOJA.endereco&&`<li>${icon("pin")}${esc(LOJA.endereco)}</li>`,
      ig&&`<li>${icon("insta")}<a href="https://instagram.com/${encodeURIComponent(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a></li>`
    ].filter(Boolean).join("");

    // destaques
    const feats=PRODUTOS.filter(p=>p.destaque&&p.disponivel);
    $("#featured").hidden=!feats.length;
    $("#rail").innerHTML=feats.map(p=>`<button type="button" class="feat" data-goto="${p.id}">${photo(p)}<span class="tag">Destaque</span><span class="body"><b>${esc(p.nome)}</b>${p.preco!=null?`<span class="price tnum">${brl(p.preco)}</span>`:""}</span></button>`).join("");

    // categorias
    const cats=[...new Set(PRODUTOS.map(p=>p.categoria))];
    $("#cats").hidden=cats.length<2;
    $("#catsInner").innerHTML=cats.map(c=>`<button type="button" class="chip" data-cat="${slug(c)}">${esc(c)}</button>`).join("");

    if(!PRODUTOS.length){
      $("#menu").innerHTML=`<div class="state"><h2>Cardápio em preparo</h2><p>Os produtos aparecem aqui assim que a loja cadastrar.</p></div>`;
    } else {
      $("#menu").innerHTML=cats.map(c=>{
        const list=PRODUTOS.filter(p=>p.categoria===c);
        return `<section class="cat" id="c-${slug(c)}" aria-labelledby="h-${slug(c)}"><h2 id="h-${slug(c)}">${esc(c)} <small>${list.length} ${list.length>1?"itens":"item"}</small></h2><ul class="items">${
          list.map(p=>`<li class="item${p.disponivel?"":" soldout"}" id="p-${p.id}"><div><h3>${esc(p.nome)}</h3>${p.desc?`<p>${esc(p.desc)}</p>`:""}<div class="row"><span class="price tnum">${p.preco!=null?brl(p.preco):"Sob consulta"}</span><span data-ctl="${p.id}">${control(p)}</span></div></div><div class="media">${photo(p)}</div></li>`).join("")
        }</ul></section>`;
      }).join("");
    }
    $("#foot").innerHTML=`Cardápio atualizado pela própria loja${ig?` · <a href="https://instagram.com/${encodeURIComponent(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a>`:""}`;
    spy(); updateCart();
  }

  /* ---------- categorias: rolagem e destaque do chip ---------- */
  let io;
  function spy(){
    io&&io.disconnect();
    const chips=[...document.querySelectorAll(".chip")];
    io=new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting){
        const id=e.target.id.slice(2);
        chips.forEach(ch=>{ const on=ch.dataset.cat===id; ch.setAttribute("aria-current",on); if(on) ch.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"}); });
      }});
    },{rootMargin:"-80px 0px -65% 0px"});
    document.querySelectorAll("section.cat").forEach(s=>io.observe(s));
  }

  /* ---------- pedido ---------- */
  const lines=()=>Object.entries(cart).map(([id,q])=>({p:PRODUTOS.find(x=>x.id===id),q})).filter(l=>l.p&&l.q>0);
  const total=()=>lines().reduce((s,l)=>s+l.p.preco*l.q,0);

  function setQty(id,d){
    cart[id]=Math.max(0,(cart[id]||0)+d); if(!cart[id]) delete cart[id];
    saveCart();
    const slot=document.querySelector(`[data-ctl="${id}"]`); const p=PRODUTOS.find(x=>x.id===id);
    if(slot&&p) slot.innerHTML=control(p);
    updateCart(d>0); renderLines();
  }
  function updateCart(bump){
    const n=lines().reduce((s,l)=>s+l.q,0);
    $("#cartbar").classList.toggle("show",n>0);
    const c=$("#cartCount"); c.textContent=n;
    if(bump){ c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
    $("#cartTotal").textContent=brl(total());
    if(!n&&$("#sheet").classList.contains("open")) closeSheet();
  }
  function renderLines(){
    $("#lines").innerHTML=lines().map(({p,q})=>`<li><div><div class="name">${esc(p.nome)}</div><div class="sub tnum">${brl(p.preco)} cada · ${brl(p.preco*q)}</div></div><span class="stepper" role="group" aria-label="Quantidade de ${esc(p.nome)}"><button type="button" data-dec="${p.id}" aria-label="Diminuir">${icon("minus")}</button><output class="tnum">${q}</output><button type="button" data-add="${p.id}" aria-label="Aumentar">${icon("plus")}</button></span></li>`).join("");
    $("#sumTotal").textContent=brl(total());
  }
  let lastFocus;
  function openSheet(){ lastFocus=document.activeElement; renderLines(); const s=$("#sheet"); s.classList.add("open"); s.setAttribute("aria-hidden","false"); document.body.style.overflow="hidden"; setTimeout(()=>$("#fName").focus({preventScroll:true}),350); }
  function closeSheet(){ const s=$("#sheet"); s.classList.remove("open"); s.setAttribute("aria-hidden","true"); document.body.style.overflow=""; lastFocus&&lastFocus.focus&&lastFocus.focus(); }

  document.addEventListener("click",e=>{
    const t=e.target.closest("[data-add],[data-dec],[data-cat],[data-goto],[data-close],#openCart");
    if(!t) return;
    if(t.dataset.add) setQty(t.dataset.add,1);
    else if(t.dataset.dec) setQty(t.dataset.dec,-1);
    else if(t.dataset.cat) document.getElementById("c-"+t.dataset.cat).scrollIntoView({behavior:"smooth"});
    else if(t.dataset.goto){ const el=document.getElementById("p-"+t.dataset.goto); el&&el.scrollIntoView({behavior:"smooth",block:"center"}); }
    else if(t.hasAttribute("data-close")) closeSheet();
    else if(t.id==="openCart") openSheet();
  });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("#sheet").classList.contains("open")) closeSheet(); });
  document.querySelectorAll('input[name="entrega"]').forEach(r=>r.addEventListener("change",()=>{ $("#addrField").hidden=!$("#rEnt").checked; }));

  $("#orderForm").addEventListener("submit",e=>{
    e.preventDefault();
    const nome=$("#fName").value.trim(), ent=$("#rEnt").checked, end=$("#fAddr").value.trim(), obs=$("#fObs").value.trim();
    $("#errName").hidden=!!nome; $("#errAddr").hidden=!ent||!!end;
    if(!nome){ $("#fName").focus(); return; }
    if(ent&&!end){ $("#fAddr").focus(); return; }
    const L=lines(); if(!L.length) return;
    const msg=[
      `Olá, ${LOJA.nome||""}! Quero fazer um pedido:`, "",
      ...L.map(({p,q})=>`• ${q}x ${p.nome} — ${brl(p.preco*q)}`), "",
      `*Total: ${brl(total())}*`, "",
      `Nome: ${nome}`,
      ent?`Entrega em: ${end}`:"Vou retirar na loja",
      obs?`Obs.: ${obs}`:null
    ].filter(x=>x!==null).join("\n");
    const num=String(LOJA.whatsapp).replace(/\D/g,"");
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`,"_blank","noopener");
  });

  load();
})();
</script>
</body>
</html>
